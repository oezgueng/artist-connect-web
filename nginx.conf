server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Apple fetches this file without an extension and insists on JSON.
  location = /.well-known/apple-app-site-association {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
  }
  location = /.well-known/assetlinks.json {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
  }

  # The legal pages still live on the old Firebase host; one hop, not a copy,
  # so there is only ever one version of the imprint and privacy policy.
  location = /info      { return 302 https://musicconnect-e5da6.web.app/info.html; }
  location = /impressum { return 302 https://musicconnect-e5da6.web.app/info.html#impressum; }
  location = /datenschutz { return 302 https://musicconnect-e5da6.web.app/info.html#datenschutz; }

  location / { try_files $uri $uri/ /index.html; }

  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy strict-origin-when-cross-origin;
}
