server {
  listen 80;
  server_name _;
  # Umleitungen relativ halten: hinter dem Proxy kennt nginx nur http und
  # schickte sonst erst auf http://, dann wieder auf https://.
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  # Apple lädt diese Datei ohne Endung und erwartet JSON.
  location = /.well-known/apple-app-site-association {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
  }
  location = /.well-known/assetlinks.json {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
  }


  # three.js sind ~700 KB unkomprimiert; gzip macht daraus ~180 KB.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

  # Vendor-Dateien sind versionsfest eingefroren.
  location /vendor/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  # Bilder aendern sich nur mit einem neuen Deploy, tragen aber keinen Hash im
  # Namen. Ein Tag ist der Kompromiss: lange genug, um Wiederbesuche billig zu
  # machen, kurz genug, dass ein neuer Screenshot nicht eine Woche braucht.
  location ~* \.(png|webp|svg|ico|jpg)$ { add_header Cache-Control "public, max-age=86400"; }

  location = /impressum { try_files /impressum.html =404; }

  # /brand — Markenmaterial zum Weiterleiten. Bewusst nirgends verlinkt und per
  # Meta-Angabe aus den Suchmaschinen gehalten; wer die Adresse hat, kommt rein.
  location = /brand { try_files /brand.html =404; }

  # Rechtstexte liegen hier. Die alte Firebase-Seite (musicconnect-e5da6.web.app/
  # info.html) leitet nur noch hierher weiter; alte Kurzadressen ebenso.
  location = /datenschutz         { try_files /datenschutz.html =404; }
  location = /nutzungsbedingungen { try_files /nutzungsbedingungen.html =404; }
  location = /privacy             { return 301 /datenschutz; }
  location = /privacy-policy      { return 301 /datenschutz; }
  location = /info                { return 301 /datenschutz; }
  location = /account-loeschen    { return 301 /datenschutz#loeschen; }
  location = /loeschen            { return 301 /datenschutz#loeschen; }
  location = /agb                 { return 301 /nutzungsbedingungen; }
  location = /terms               { return 301 /nutzungsbedingungen; }
  location = /imprint             { return 301 /impressum; }

  location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /brand\nDisallow: /brand/\nSitemap: https://artist-connect.de/\n";
  }

  location / { try_files $uri $uri/ /index.html; }

  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy strict-origin-when-cross-origin;
}
