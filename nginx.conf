server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Apple lädt diese Datei ohne Endung und erwartet JSON.
  location = /.well-known/apple-app-site-association {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
  }
  location = /.well-known/assetlinks.json {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
  }


  # three.js sind ~700 KB unkomprimiert; gzip macht daraus ~180 KB.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

  # Vendor-Dateien sind versionsfest eingefroren.
  location /vendor/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  # Bilder aendern sich nur mit einem neuen Deploy, tragen aber keinen Hash im
  # Namen. Ein Tag ist der Kompromiss: lange genug, um Wiederbesuche billig zu
  # machen, kurz genug, dass ein neuer Screenshot nicht eine Woche braucht.
  location ~* \.(png|webp|svg|ico|jpg)$ { add_header Cache-Control "public, max-age=86400"; }

  location = /impressum { try_files /impressum.html =404; }

  # Datenschutz und Nutzungsbedingungen liegen weiterhin auf der alten
  # Firebase-Seite: ein Sprung statt einer Kopie, damit es nur eine Fassung gibt.
  location = /datenschutz { return 302 https://musicconnect-e5da6.web.app/info.html; }
  location = /info        { return 302 https://musicconnect-e5da6.web.app/info.html; }

  location / { try_files $uri $uri/ /index.html; }

  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy strict-origin-when-cross-origin;
}
